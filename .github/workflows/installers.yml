name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential libasound2-dev libjack-jackd2-dev libx11-dev
          libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev
          libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -G DEB
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitch-curve-linux-x64
          path: |
            Pitch-Curve-*.deb
            Pitch-Curve-*.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure macOS Universal
        run: |
          set -o pipefail
          cmake -S . -B build -G Xcode -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            2>&1 | tee "$RUNNER_TEMP/macos-build.log"
      - name: Build macOS Universal
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 \
            2>&1 | tee -a "$RUNNER_TEMP/macos-build.log"
      - name: Test macOS Universal
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure \
            2>&1 | tee -a "$RUNNER_TEMP/macos-build.log"
      - name: Package macOS Universal
        run: |
          set -o pipefail
          stage="$RUNNER_TEMP/pitch-curve-root"
          component="$RUNNER_TEMP/Pitch-Curve-component.pkg"
          rm -rf "$stage"
          cmake --install build --config Release --prefix "$stage" \
            --component ContourRuntime 2>&1 | tee -a "$RUNNER_TEMP/macos-build.log"
          binaries=(
            "$stage/Library/Audio/Plug-Ins/VST3/Pitch Curve.vst3/Contents/MacOS/Pitch Curve"
            "$stage/Library/Audio/Plug-Ins/Components/Pitch Curve.component/Contents/MacOS/Pitch Curve"
            "$stage/Applications/Pitch Curve.app/Contents/MacOS/Pitch Curve"
          )
          for binary in "${binaries[@]}"; do
            test -f "$binary"
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          pkgbuild --root "$stage" \
            --identifier audio.circus.pitchcurve \
            --version 0.8 --install-location / "$component" \
            2>&1 | tee -a "$RUNNER_TEMP/macos-build.log"
          productbuild --package "$component" \
            Pitch-Curve-0.8-macOS-Universal.pkg \
            2>&1 | tee -a "$RUNNER_TEMP/macos-build.log"
          shasum -a 256 Pitch-Curve-0.8-macOS-Universal.pkg \
            > Pitch-Curve-0.8-macOS-Universal.pkg.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitch-curve-macos-universal
          path: |
            Pitch-Curve-*.pkg
            Pitch-Curve-*.sha256
          if-no-files-found: error
      - name: Publish unsigned macOS 0.8 package
        if: startsWith(github.ref, 'refs/tags/v0.8-macos-build')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.8 >/dev/null 2>&1 \
            || gh release create v0.8 --verify-tag \
                 --title "Pitch Curve 0.8" \
                 --notes "Unsigned development build. Includes Universal VST3, AU, and Standalone formats."
          gh release upload v0.8 Pitch-Curve-*.pkg Pitch-Curve-*.pkg.sha256 --clobber
          if ! git ls-remote --exit-code --tags origin refs/tags/macos-ready-0.8; then
            git tag macos-ready-0.8 "$GITHUB_SHA"
            git push origin macos-ready-0.8
          fi
      - name: Export macOS package for direct retrieval
        if: startsWith(github.ref, 'refs/tags/v0.8-macos-build')
        run: |
          mkdir -p /tmp/pitch-curve-package
          cp Pitch-Curve-*.pkg.sha256 /tmp/pitch-curve-package/
          split -b 45m Pitch-Curve-*.pkg \
            /tmp/pitch-curve-package/Pitch-Curve-0.8-macOS-Universal.pkg.part-
          git checkout --orphan "macos-artifact-0.8-${GITHUB_RUN_ID}"
          git rm -rf .
          cp /tmp/pitch-curve-package/* .
          git add -f Pitch-Curve-*.pkg.sha256 Pitch-Curve-*.pkg.part-*
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Publish macOS 0.8 package"
          git push origin "HEAD:refs/heads/macos-artifact-0.8-${GITHUB_RUN_ID}"
      - name: Mark macOS build failure
        if: failure() && startsWith(github.ref, 'refs/tags/v0.8-macos-build')
        run: |
          cp "$RUNNER_TEMP/macos-build.log" /tmp/macos-build.log
          git checkout --orphan "macos-diagnostics-${GITHUB_RUN_ID}"
          git rm -rf .
          cp /tmp/macos-build.log .
          git add -f macos-build.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "macOS 0.8 build diagnostics"
          git push origin "HEAD:refs/heads/macos-diagnostics-${GITHUB_RUN_ID}"

  windows:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: >
          cmake -S . -B build -G "Visual Studio 17 2022"
          -A ${{ matrix.architecture }} -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - if: matrix.architecture == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -C Release -G NSIS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitch-curve-windows-${{ matrix.architecture }}
          path: |
            Pitch-Curve-*.exe
            Pitch-Curve-*.sha256
          if-no-files-found: error
